name: DFBnet import

on:
  schedule:
    # Weekly, Monday night: Tue 01:17 UTC = 02:17 Berlin (winter) / 03:17 (summer).
    # On demand: Actions -> DFBnet import -> Run workflow.
    - cron: "17 1 * * 2"
  workflow_dispatch:
    inputs:
      mode:
        description: "current = this season only, full = all seasons"
        type: choice
        options: [current, full]
        default: current
      seasons:
        description: "Optional: comma separated seasons, e.g. 26/27,25/26 (overrides mode)"
        required: false

concurrency:
  group: dfbnet-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q
      - name: Import
        env:
          DFBNET_USERNAME: ${{ secrets.DFBNET_USERNAME }}
          DFBNET_PASSWORD: ${{ secrets.DFBNET_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLUB_PATTERN: "FC Treptow"
        run: |
          ARGS="--mode ${{ inputs.mode || 'current' }} --out out"
          if [ -n "${{ inputs.seasons }}" ]; then ARGS="$ARGS --seasons ${{ inputs.seasons }}"; fi
          python -m importer run $ARGS
      - name: Keep exports (3 days, private)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dfbnet-exports
          path: out/
          retention-days: 3
          if-no-files-found: ignore
